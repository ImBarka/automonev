name: automonev-jaga

# Login ke monev dijalankan dari laptop (Cloudflare Kemnaker memblokir server GitHub).
# Workflow ini hanya penjaga: kalau laptop belum melapor "aman" hari ini,
# kirim peringatan ke Telegram supaya kamu isi manual.

on:
  schedule:
    # GitHub cron pakai UTC (WIB = UTC+7). Jadwal bisa telat 5–30 menit.
    - cron: "30 14 * * *"  # 21.30 WIB
    - cron: "15 16 * * *"  # 23.15 WIB
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # untuk keepalive di bawah

jobs:
  jaga:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cek laporan laptop
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python automonev.py jaga
      # GitHub mematikan jadwal kalau repo 60 hari tanpa aktivitas; ini menyalakannya lagi.
      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/automonev.yml/enable" || true
